- field_name: beneficial_ownership_intent_quant
  route: owner
  form_families:
  - 13D
  - 13G
  locators:
  - section_window
  - parse_text_window
  anchor_terms:
  - item 4
  - purpose of transaction
  - cover page
  regex_patterns:
  - (?i)\b(passive|engaged|activist|control)\b
  - (?i)\b(board\s+seat|proxy\s+fight|group\s+formed|strategic\s+alternatives|merger)\b
  output_kind: json
  output_schema: v1/beneficial_ownership_intent_quant
  normalizer_overrides:
    mode: regex_json
    field_patterns:
      stance:
        passive: (?i)\bpassive\b
        engaged: (?i)\bengaged\b
        activist: (?i)\bactivist\b
        control: (?i)\bcontrol\b
      group_formed:
        true: (?i)\bgroup\s+formed\b
        false: (?i)\bno\s+group\b
      horizon:
        short: (?i)\bshort\b
        medium: (?i)\bmedium\b
        long: (?i)\blong\b
        unclear: (?i)\bunclear\b
  qa_rules:
    require_stance_enum: true
    require_group_flag: true
    allow_short: true
    allow_medium: true
    allow_long: true
    allow_unclear: true
  span_policy:
    anchor_headers:
    - item 4
    - purpose of transaction
    min_tokens: 2
    max_tokens: 180
    preferred_tokens:
    - 2
    - 180
    expand_steps:
    - 0
    avoid:
    - table of contents
  implemented: true
