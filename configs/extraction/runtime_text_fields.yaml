fields:
- field_name: current_event_quant
  route: issuer
  form_families:
  - 8-K
  - 6-K
  locators:
  - item_window
  - section_window
  anchor_terms:
  - item
  - press release
  - current report
  regex_patterns:
  - (?i)\b(event|announcement|transaction|agreement)\b
  - (?i)\b(material\s+definitive\s+agreement|results\s+of\s+operations|financial\s+condition)\b
  output_kind: json
  output_schema: v1/current_event_quant
  normalizer_overrides:
    mode: regex_json
    field_patterns:
      event_type:
        agreement: (?i)\bagreement\b
        results: (?i)\bresults?\b
        financing: (?i)\bfinancing\b
        governance: (?i)\bgovernance\b
        other: (?i)\bevent|announcement|transaction\b
  qa_rules:
    materiality_score_min: 0
    materiality_score_max: 5
    cash_impact_usd_nullable: true
    dilution_pct_nullable: true
    one_time_cost_usd_nullable: true
  span_policy:
    anchor_headers:
    - item
    - current report
    - press release
    min_tokens: 1
    max_tokens: 160
    preferred_tokens:
    - 1
    - 160
    expand_steps:
    - 0
    avoid:
    - table of contents
  implemented: true
