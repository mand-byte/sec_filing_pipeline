- field_name: amendment_scope_quant
  route: holding
  form_families:
  - 13F-HR/A
  locators:
  - section_window
  - parse_text_window
  anchor_terms:
  - amendment
  - amendment note
  - header
  regex_patterns:
  - (?i)\b(amendment|restatement|correction|addition|deletion)\b
  - (?i)\b(position\s+count\s+delta|value\s+delta|restatement\s+flag)\b
  output_kind: json
  output_schema: v1/amendment_scope_quant
  normalizer_overrides:
    mode: regex_json
    field_patterns:
      scope:
        full: (?i)\bfull\s+amendment|full\s+restatement\b
        partial: (?i)\bpartial\b
        restatement: (?i)\brestatement\b
        other: (?i)\bcorrection|addition|deletion|amendment\b
      only_new_holdings:
        true: (?i)\bonly\s+new\s+holdings\b
        false: (?i)\bnot\s+only\s+new\s+holdings\b
      only_restated_values:
        true: (?i)\bonly\s+restated\s+values\b
        false: (?i)\bnot\s+only\s+restated\s+values\b
  qa_rules:
    position_count_delta_nullable: true
    value_delta_usd_nullable: true
    restatement_flag_required: true
  span_policy:
    anchor_headers:
    - amendment
    - amendment note
    - header
    min_tokens: 2
    max_tokens: 120
    preferred_tokens:
    - 5
    - 120
    expand_steps:
    - 0
    avoid:
    - table of contents
  implemented: true
