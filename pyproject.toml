[project]
name = "sec-filing-pipeline"
version = "0.1.0"
description = "SEC Filing Backend - Phase 1"
readme = "DEMANDS.md"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.10.4",
    "clickhouse-connect",
    "edgartools",
    "lxml>=5.2.0",
    "psycopg[binary]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "typer>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
